<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UI 스튜디오 · 페이지 샘플</title><link rel="stylesheet" href="/ui-studio/source/styles.css"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body.sample-page{padding:14px;color:#e7edf5;background:#17202d;display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px;height:100dvh}.sample-header{display:grid;gap:8px;min-width:0}.sample-title{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.sample-project{font-size:12px;color:#b4c3d5;overflow-wrap:anywhere}.sample-navigation{display:flex;align-items:center;gap:8px}.sample-navigation label{min-width:0;flex:1}.sample-navigation select{width:100%;min-width:0}.sample-header button,.sample-header select{min-height:36px}.sample-info{margin:0;font-size:12px;color:#c2cedd;overflow-wrap:anywhere}#sample-viewport{min-height:0;min-width:0;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#d5d9df;border-radius:8px;padding:12px}#sample-stage{position:relative;flex:none}#sample-board{position:absolute;inset:0;transform-origin:top left;box-shadow:0 4px 18px #0003;border:0;border-radius:0;background:#d5d9df;overflow:hidden}.sample-screen{position:absolute;inset:0;overflow:hidden}.sample-panel{position:absolute;overflow:hidden}.sample-screen.game-skin,.sample-panel.game-skin{border:0 solid transparent;border-image-source:var(--skin-source);border-image-slice:var(--skin-slices);border-image-width:var(--skin-edges);border-image-repeat:var(--skin-repeat);background:var(--skin-tone);color:var(--skin-text);padding:0}.sample-page .ui-element{touch-action:manipulation}@media(max-width:500px){body.sample-page{padding:8px;gap:6px}.sample-title strong{font-size:14px}.sample-navigation{gap:4px}.sample-header button{padding:6px 8px}.sample-project{font-size:11px}}
</style></head><body class="sample-page"><header class="sample-header"><div class="sample-title"><strong>UI 스튜디오 · 페이지 샘플</strong><button id="sample-refresh" type="button">다시 읽기</button></div><div id="sample-project" class="sample-project"></div><div class="sample-navigation"><button id="sample-previous" type="button" disabled>이전</button><label><select id="sample-select" aria-label="화면 선택" disabled></select></label><button id="sample-next" type="button" disabled>다음</button></div><p id="sample-status" class="sample-info" role="status">설계를 읽습니다…</p><p id="sample-screen-info" class="sample-info"></p></header><main id="sample-viewport" aria-label="단독 화면 샘플"><div id="sample-stage"><div id="sample-board"></div></div></main><script type="module" src="/ui-studio/source/sample-preview.mjs"></script></body></html>
