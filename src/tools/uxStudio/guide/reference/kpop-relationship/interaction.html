<!doctype html>
<title>관계 · 2차 동작 미리보기</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<div id="km-team-start" class="viz-dotted-background"><div class="phone" aria-label="팀 관계 시안"></div></div>
<style>
#km-team-start {color-scheme:light dark;--ink:light-dark(#25323a,#eff3f6);--muted:light-dark(#53626d,#b1bec8);--base:light-dark(#f0f2f3,#202932);--paper:light-dark(#fff,#28343e);--line:light-dark(#b9c2c8,#526273);--selected:light-dark(#dfe6eb,#3a5062);--warm:light-dark(#f7eee8,#473530);color:var(--ink);font:13px/1.4 system-ui,sans-serif}
#km-team-start *,#km-team-start *::before,#km-team-start *::after{box-sizing:border-box}
#km-team-start .phone{width:min(390px,calc(100% - 16px));height:742px;margin:8px auto;background:var(--base);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
#km-team-start h2,#km-team-start h3,#km-team-start p{margin:0}
#km-team-start button{font:inherit;font-weight:700;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;min-height:39px;padding:5px 8px}
#km-team-start button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#km-team-start button[aria-pressed=true]{background:var(--selected)}
#km-team-start header,#km-team-start footer{background:var(--paper);padding:8px 10px;display:flex;align-items:center;gap:5px;border-bottom:1px solid var(--line)}
#km-team-start header h2{font-size:18px;margin-right:auto}
#km-team-start footer{justify-content:space-between;border-top:1px solid var(--line);border-bottom:0;padding-block:13px;font-size:11px;color:var(--muted)}
#km-team-start nav{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 9px 0}
#km-team-start .inside{min-height:0;flex:1;display:flex;flex-direction:column;gap:8px;padding:9px}
#km-team-start .stage{border:1px solid var(--line);border-radius:7px;background:var(--paper);padding:8px;flex:none}
#km-team-start .lineup{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:4px;align-items:end;margin-inline:auto}
#km-team-start .lineup[data-size="2"]{max-width:210px}
#km-team-start .lineup button{padding:3px 1px;border-color:transparent;min-width:0;display:grid;justify-items:center;gap:3px;font-size:11px}
#km-team-start .lineup img,#km-team-start .lineup .initial{width:100%;height:var(--portrait);object-fit:contain;font-size:20px}
#km-team-start .initial{display:grid;place-items:center;background:var(--selected);border-radius:50%;font-weight:700}
#km-team-start .hint{text-align:center;color:var(--muted);font-size:11px;padding-top:8px}
#km-team-start .card-mode{--portrait:68px;flex:none}
#km-team-start .card-mode .lineup{gap:6px;margin:0}
#km-team-start .card-mode .lineup[data-size="2"]{max-width:none}
#km-team-start .card-mode .lineup button{border-color:var(--line);border-radius:5px;align-content:start;justify-items:stretch;text-align:left;padding:5px 6px;gap:4px;font-size:12px}
#km-team-start .card-mode .lineup button[aria-pressed=true]{border-color:var(--ink)}
#km-team-start .card-mode .lineup .initial{width:44px;height:44px;margin:12px auto}
#km-team-start .card-mode h3{margin:0 0 6px;font-size:13px}
#km-team-start .section-title{display:flex;justify-content:space-between;align-items:center;gap:5px;padding:3px 1px;color:var(--ink);font-size:13px}
#km-team-start .section-title span{color:var(--muted);font-size:11px}
#km-team-start .section-title select{font:inherit;font-size:11px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;min-height:32px;padding:3px 6px}
#km-team-start .list{overflow:auto;min-height:0;display:grid;align-content:start;gap:6px;padding-right:1px}
#km-team-start .row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:4px 6px;gap:4px}
#km-team-start .row.tension{background:var(--warm)}
#km-team-start .row .detail{background:transparent;border:0;display:flex;align-items:center;gap:6px;text-align:left;padding:2px;min-width:0}
#km-team-start .row small{display:block;color:var(--muted);font-weight:500;font-size:11px}
#km-team-start .faces{display:flex;flex:none}
#km-team-start .faces img,#km-team-start .faces .initial{width:21px;height:24px;object-fit:contain;border-radius:50%;border:1px solid var(--line);background:var(--paper);font-size:11px}
#km-team-start .faces :nth-child(2){margin-left:-3px}
#km-team-start .send{font-size:11px;white-space:nowrap}
#km-team-start dialog{max-width:calc(100% - 24px);width:340px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:16px}
#km-team-start dialog::backdrop{background:#161c2466}
#km-team-start dialog:has(.schedule){margin:auto auto 0;border-radius:10px 10px 0 0}
#km-team-start dialog .row{margin-top:6px}
#km-team-start dialog form{margin-top:12px}
#km-team-start .map{position:relative;height:246px}
#km-team-start .map svg{position:absolute;inset:0;width:100%;height:100%;color:var(--muted);pointer-events:none}
#km-team-start .map button{position:absolute;transform:translate(-50%,-50%);display:grid;justify-items:center;font-size:11px;padding:2px 5px}
#km-team-start .map img,#km-team-start .map .initial{width:28px;height:28px;object-fit:contain}
@media(max-width:355px){#km-team-start .phone{margin-inline:3px;width:calc(100% - 6px)}#km-team-start .inside{padding-inline:6px}#km-team-start .lineup{gap:2px}}
#km-team-start .phone{margin-inline:auto}
#km-team-start .deck{flex:none}
#km-team-start .deck-body{height:194px;margin-top:4px}
#km-team-start .deck-body[data-paged]{touch-action:pan-y}
#km-team-start .deck-grid button{height:94px;align-content:center}
#km-team-start .card-mode{--portrait:59px}
#km-team-start .card-mode .lineup .initial{height:36px;width:36px;margin:11.5px auto;font-size:17px}
#km-team-start .deck button[data-return],#km-team-start .pager button{min-height:32px}
#km-team-start .pager{display:flex;align-items:center;gap:6px}
#km-team-start .pager button{min-width:34px;padding:2px 6px;font-size:18px}
#km-team-start button:disabled{opacity:.45}
#km-team-start .deck-focus{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.65fr);gap:8px;border:1px solid var(--line);border-radius:7px;background:var(--paper);padding:8px}
#km-team-start .lead{display:grid;place-content:center;justify-items:center;text-align:center;min-width:0;overflow-wrap:anywhere}
#km-team-start .lead img,#km-team-start .lead .initial{width:100%;height:123px;object-fit:contain}
#km-team-start .lead .initial{width:58px;height:58px;font-size:26px;margin-bottom:8px}
#km-team-start .near{border-left:1px solid var(--line);padding:2px 0 2px 8px;display:grid;gap:5px;align-content:start;min-width:0}
#km-team-start .near-item{display:grid;align-items:center;grid-template-columns:auto 1fr auto;gap:5px;text-align:left;min-width:0;padding:4px 5px}
#km-team-start .near p{color:var(--muted);font-size:12px}
#km-team-start dialog:has(.map-sheet){margin:auto auto 0;border-radius:10px 10px 0 0;width:390px;max-height:88vh}
#km-team-start .map-sheet{display:grid;gap:8px}
#km-team-start .switches{display:flex;gap:4px}
#km-team-start .switches button{flex:1;min-width:0;white-space:nowrap;font-size:11px;padding:4px 3px}
#km-team-start .map{height:260px}
#km-team-start .map button{min-width:34px;min-height:36px;padding:1px 3px}
#km-team-start .map img,#km-team-start .map .initial{width:25px;height:25px}
#km-team-start .map line{stroke:var(--line);stroke-width:1.5}
#km-team-start .map line.picked{stroke:var(--ink);stroke-width:2}
#km-team-start .map line.dashed{stroke-dasharray:4 3}
#km-team-start .map line.target{pointer-events:stroke;stroke:transparent;stroke-width:10}
#km-team-start .map-select{display:flex;align-items:center;justify-content:space-between;gap:5px}
#km-team-start .map-select select{max-width:69%;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:6px}

#km-team-start dialog{width:374px;height:min(748px,calc(100dvh - 16px));max-height:none;overflow:auto}
#km-team-start dialog:has(.map-sheet),#km-team-start dialog:has(.schedule){max-height:calc(100dvh - 12px);width:374px}
#km-team-start dialog[open]{display:flex;flex-direction:column}
#km-team-start dialog[open] form{margin-top:auto;padding-top:12px}
#km-team-start .schedule .row{grid-template-columns:52px minmax(0,1fr) auto;min-height:61px;text-align:left}
#km-team-start .schedule .row img{width:52px;height:43px;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
#km-team-start .schedule .row button{font-size:11px;white-space:nowrap}
#km-team-start .schedule .actions{display:flex;gap:6px;margin-top:10px}
#km-team-start .schedule h3{margin-bottom:5px}
</style>

 const role=id=>roles[Number(id)];
 const pairKey=(a,b)=>[a,b].sort().join('');
 const pairTitle=id=>id[0]+' ↔ '+id[1];
 const pairs=team=>team.flatMap((a,i)=>team.slice(i+1).map(b=>pairKey(a,b)));
 const status=id=>id==='AD'?'긴장 중':known.get(id)?.stage??'관계 기록 대기';
 const pic=(id,large=false)=>{
  const asset=(large?full:art)[id]||art[id];
  return asset?'<img alt="" src="'+asset+'">':'<span class="initial" aria-hidden="true">'+(role(id)?.slice(0,1)??id)+'</span>';
 };
 const sortScore=(a,b)=> a==null?(b==null?0:1):b==null?-1:(state.sort==='far'?a-b:b-a);
 const row=(left,action='',tone='')=>'<div class="row '+tone+'">'+left+action+'</div>';
 function relationRow(id){
  return row('<button class="detail" data-detail="'+id+'"><span class="faces">'+pic(id[0])+pic(id[1])+'</span><span><b>'+pairTitle(id)+'</b><small>'+status(id)+(milestones[id]?' · '+milestones[id]:'')+'</small></span></button>',
   '<button class="send" data-send="'+id+'">함께 보내기 ›</button>',id==='AD'?'tension':'');
 }
 function staffRecord(id){
  const score=scores[Number(id)];
  const steps=[12,16,20], next=steps.find(value=>value>score);
  const bonus=steps.filter(value=>score>=value).length*5;
  return '라포 '+score+' · '+(bonus?'보너스 +'+bonus+'%':'보너스 없음')+' · '+(next==null?'최고 단계':(steps.indexOf(next)+1)+'단계까지 '+(next-score));
 }
 function deck(team){
  const staff=state.tab==='staff';
  const entries=staff?roles.map((_,i)=>String(i)):team;
  const pageCount=Math.ceil(entries.length/6);
  const window=entries.slice(state.page*6,state.page*6+6);
  const focused=state.focus;
  const title=staff?'스태프 '+entries.length+'명':'팀원 '+team.length+'명';
  const pager=pageCount>1?'<div class="pager"><button data-step="-1" aria-label="이전 카드" '+(state.page===0?'disabled':'')+'>‹</button><span>'+(state.page+1)+' / '+pageCount+'</span><button data-step="1" aria-label="다음 카드" '+(state.page===pageCount-1?'disabled':'')+'>›</button></div>':'';
  let content;
  if(focused===null){
   content='<div class="card-mode"><div class="lineup deck-grid" style="--cols:3">'+window.map(id=>'<button data-ref="'+id+'">'+pic(id)+'<span>'+(staff?role(id):member(id))+'</span></button>').join('')+'</div></div>';
  }else{
   const near=staff?(scores[Number(focused)]>0?[{id:'A',score:scores[Number(focused)]}]:[]):team
    .filter(id=>id!==focused).map(id=>({id,score:known.get(pairKey(id,focused))?.score}))
    .filter(item=>item.score!=null).sort((a,b)=>b.score-a.score).slice(0,3);
   const list=near.length?near.map(({id,score})=>'<button class="near-item" '+(staff?'data-role="'+focused+'"':'data-detail="'+pairKey(id,focused)+'"')+'><span class="faces">'+pic(id)+'</span><b>'+member(id)+'</b><strong>'+score+'</strong></button>').join(''):'<p>확인된 가까운 관계가 없어요.</p>';
   content='<div class="deck-focus"><div class="lead">'+pic(focused,true)+'<b>'+(staff?role(focused):member(focused))+'</b></div><div class="near"><b>가까운 관계</b>'+list+'</div></div>';
  }
  return '<section class="deck" aria-label="'+title+'"><div class="section-title"><h3>'+title+'</h3>'+(focused===null?pager:'<button data-return>목록으로 ‹</button>')+'</div><div class="deck-body" '+(focused===null?'data-paged':'')+'>'+content+'</div></section>';
 }
 function render(){
  const team=idols.slice(0,Number(state.size));
  const staff=state.tab==='staff';
  const sort='<select data-sort aria-label="관계 목록 정렬"><option value="far" '+(state.sort==='far'?'selected':'')+'>관계 안 좋은 순</option><option value="near" '+(state.sort==='near'?'selected':'')+'>관계 좋은 순</option></select>';
  const ids=pairs(team).sort((a,b)=>sortScore(known.get(a)?.score,known.get(b)?.score));
  const staffOrder=roles.map((_,i)=>String(i)).sort((a,b)=>sortScore(scores[Number(a)],scores[Number(b)]));
  const rows=staff?staffOrder.map(id=>row('<button class="detail" data-role="'+id+'"><span class="faces">'+pic(id)+'</span><span><b>'+role(id)+'</b><small>멤버 A · '+staffRecord(id)+'</small></span></button>')).join(''):ids.map(relationRow).join('');
  phone.innerHTML='<header><h2>관계</h2><button data-map>관계도</button></header><nav aria-label="관계 대상"><button data-tab="idol" aria-pressed="'+!staff+'">아이돌끼리</button><button data-tab="staff" aria-pressed="'+staff+'">스태프와</button></nav><div class="inside">'+deck(team)+'<div class="section-title"><h3>'+(staff?'스태프 관계':('팀 관계 · '+ids.length+'쌍'))+'</h3>'+sort+'</div><div class="list" aria-label="관계 목록">'+rows+'</div></div><footer><span>포토카드</span><span>스케줄</span><span>건설</span><span>미션</span><span>상점</span><b>정보 › 관계</b></footer><dialog aria-label="관계 상세"></dialog>';
 }
 const close='<form method="dialog"><button>닫기</button></form>';
 const match=(id,filter)=>filter==='all'||filter==='tense'&&id==='AD'||filter==='first'&&status(id)==='처음 봄'||filter==='near'&&['친한 동료','단짝'].includes(status(id));
 function mapContent(){
  const team=idols.slice(0,state.mapSize);
  const pts=team.map((_,i)=>{
   if(team.length===2)return [i===0?26:74,50];
   const angle=i*2*Math.PI/team.length-Math.PI/2;
   return [50+36*Math.cos(angle),50+39*Math.sin(angle)];
  });
  const visible=pairs(team).filter(id=>known.has(id)&&match(id,state.filter)&&(!state.node||id.includes(state.node)));
  if(!visible.includes(state.pair))state.pair=null;
  const links=visible.map(id=>{
   const [x,y]=pts[team.indexOf(id[0])], [u,v]=pts[team.indexOf(id[1])];
   const tone=id===state.pair?'picked':id==='AD'||status(id)==='처음 봄'?'dashed':'';
   return '<line class="'+tone+'" x1="'+x+'%" y1="'+y+'%" x2="'+u+'%" y2="'+v+'%"/><line class="target" data-edge="'+id+'" x1="'+x+'%" y1="'+y+'%" x2="'+u+'%" y2="'+v+'%"/>';
  }).join('');
  const nodes=team.map((id,i)=>'<button data-node="'+id+'" aria-label="'+member(id)+'" aria-pressed="'+(state.node===id)+'" style="left:'+pts[i][0]+'%;top:'+pts[i][1]+'%">'+pic(id)+id+'</button>').join('');
  const picked=state.pair?relationRow(state.pair):'';
  return '<section class="map-sheet"><h3>팀 관계도</h3><div class="switches" aria-label="관계도 인원 예시">'+[2,5,10].map(n=>'<button data-count="'+n+'" aria-pressed="'+(state.mapSize===n)+'">'+n+'명</button>').join('')+'</div><div class="switches" aria-label="관계 필터">'+Object.entries(filters).map(([id,label])=>'<button data-filter="'+id+'" aria-pressed="'+(id===state.filter)+'">'+label+'</button>').join('')+'</div><div class="map"><svg aria-hidden="true">'+links+'</svg>'+nodes+'</div><label class="map-select">두 사람 관계<select data-map-pair><option value="">선택</option>'+visible.map(id=>'<option value="'+id+'" '+(state.pair===id?'selected':'')+'>'+pairTitle(id)+' · '+status(id)+'</option>').join('')+'</select></label>'+picked+'</section>'+close;
 }
 function showMap(dialog){
  dialog.innerHTML=mapContent();
  if(!dialog.open)dialog.showModal();
 }
 function showSchedules(dialog,pair,all=false){
  dialog.dataset.pair=pair;
  const title=all?'스케줄 목록 · 편성 유지':'함께 보낼 스케줄';
  dialog.innerHTML='<section class="schedule"><h3>'+title+'</h3><p>'+pairTitle(pair)+' · 2명 편성</p>'+
   (all?'<p class="hint">검수용 추천 스케줄 3개</p>':'')+
   routes.map(([label,time,photo],i)=>row('<img alt="" src="'+photo+'"><span><b>'+label+'</b><small>'+time+'분 · 추천 2명</small></span>','<button data-route="'+i+'">편성하기 ›</button>')).join('')+
   '<div class="actions"><button data-schedule-view="'+(all?'recommend':'all')+'">'+(all?'추천 목록으로':'스케줄 전체 보기')+'</button></div></section>'+closeControls(dialog);
 }
 function closeControls(dialog){
  return (dialog.dataset.origin==='map'?'<button data-return-map>관계도로 돌아가기</button>':'')+close;
 }
 function changePage(delta){
  if(state.focus!==null)return;
  const max=Math.ceil((state.tab==='staff'?roles.length:Number(state.size))/6)-1;
  const next=Math.max(0,Math.min(max,state.page+delta));
  if(next!==state.page){state.page=next;render();}
 }
 phone.addEventListener('change',e=>{
  if(e.target.matches('[data-sort]')){
   state.sort=e.target.value;render();phone.querySelector('[data-sort]').focus();
  }
  if(e.target.matches('[data-map-pair]')){
   state.pair=e.target.value;const dialog=phone.querySelector('dialog');showMap(dialog);dialog.querySelector('[data-map-pair]').focus();
  }
 });
 let touchOrigin;
 phone.addEventListener('touchstart',e=>{
  touchOrigin=e.target.closest('[data-paged]')?[e.changedTouches[0].clientX,e.changedTouches[0].clientY]:null;
 },{passive:true});
 phone.addEventListener('touchend',e=>{
  if(!touchOrigin)return;
  const [x,y]=touchOrigin, point=e.changedTouches[0];
  touchOrigin=null;
  const dx=point.clientX-x;
  if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(point.clientY-y))changePage(dx<0?1:-1);
 });
 phone.addEventListener('click',e=>{
  const dialog=phone.querySelector('dialog');
  if(e.target.dataset.edge){state.pair=e.target.dataset.edge;showMap(dialog);return;}
  const button=e.target.closest('button');
  if(!button)return;
  const {tab,step,ref,count,filter,node,detail,send,route}=button.dataset;
  if(tab){state.tab=tab;state.page=0;state.focus=null;render();phone.querySelector('[data-tab="'+tab+'"]').focus();return;}
  if(step){
   changePage(Number(step));
   const target=phone.querySelector('[data-step="'+step+'"]:not(:disabled),[data-ref]');
   (phone.querySelector('[data-step="'+step+'"]:not(:disabled)')??target)?.focus();
   return;
  }
  if(ref!=null){state.focus=ref;render();phone.querySelector('[data-return]').focus();return;}
  if(button.hasAttribute('data-return')){
   const previous=state.focus;state.focus=null;render();phone.querySelector('[data-ref="'+previous+'"]')?.focus();return;
  }
  if(button.hasAttribute('data-map')){
   delete dialog.dataset.origin;state.mapSize=Number(state.size);state.filter='all';state.node=null;state.pair=null;showMap(dialog);return;
  }
  if(count||filter||node){
   if(count){state.mapSize=Number(count);state.node=null;}
   if(filter)state.filter=filter;
   if(node)state.node=state.node===node?null:node;
   state.pair=null;showMap(dialog);
   dialog.querySelector(count?'[data-count="'+count+'"]':filter?'[data-filter="'+filter+'"]':'[data-node="'+node+'"]')?.focus();
   return;
  }
  if(button.hasAttribute('data-return-map')){delete dialog.dataset.origin;showMap(dialog);return;}
  if(button.dataset.scheduleView){showSchedules(dialog,dialog.dataset.pair,button.dataset.scheduleView==='all');dialog.querySelector('[data-schedule-view]').focus();return;}
  if(dialog.querySelector('.map-sheet'))dialog.dataset.origin='map';
  if(button.dataset.role!=null){
   const id=button.dataset.role;
   dialog.innerHTML='<h3>'+role(id)+'</h3><p>멤버 A · '+staffRecord(id)+'</p>'+close;
  }else if(send){
   showSchedules(dialog,send);
  }else if(detail){
   const score=known.get(detail)?.score;
   dialog.innerHTML='<h3>'+pairTitle(detail)+'</h3><p>'+status(detail)+(score!=null?' · 가까움 '+score:'')+'</p>'+(milestones[detail]?'<p>'+milestones[detail]+'</p>':'')+close;
  }else if(route!=null){
   const [label,time,,routeKey]=routes[Number(route)];
   dialog.innerHTML='<section class="schedule" data-preview-route="'+routeKey+'"><h3>'+label+'</h3><p>'+time+'분 · 편성 확인</p><div class="deck-focus"><div><b>참가자 1</b><p>'+member(dialog.dataset.pair[0])+'</p></div><div><b>참가자 2</b><p>'+member(dialog.dataset.pair[1])+'</p></div></div><div class="actions"><button data-schedule-view="recommend">추천 목록으로</button></div></section>'+close;
  }else return;
  if(dialog.dataset.origin==='map'){
   const form=dialog.querySelector('form');
   if(form&&!dialog.querySelector('[data-return-map]'))form.outerHTML=closeControls(dialog);
  }
  if(!dialog.open)dialog.showModal();
  else dialog.querySelector('button').focus();
 });
 render();
 if(globalThis.Tweak){
  const tweak=new Tweak({container:phone,onChange:()=>{state.page=0;state.focus=null;render();}});
  tweak.addSelect(state,'size',{label:'팀원 수',options:[2,5,10].map(n=>({label:n+'명',value:String(n)}))});
 }
})();
</script>
