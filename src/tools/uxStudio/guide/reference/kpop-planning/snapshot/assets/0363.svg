<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="710" viewBox="0 0 1020 710" role="img" aria-labelledby="t d"><title id="t">앨범에서 월드페스티벌까지 한눈에 보기</title><desc id="d">앨범 발매, 하루 차트, 활동과 START 정산, 종료 후 성장 보존, 다음 앨범으로 반복합니다. 발매한 곡은 매주 페스티벌과 마지막 9주차 월드 무대로 이어집니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#a5c5d6"/></marker></defs><rect width="1020" height="710" rx="16" fill="#09283e"/><g font-family="Apple SD Gothic Neo,Noto Sans KR,sans-serif"><text x="28" y="43" font-size="28" font-weight="700" fill="#fff1cf">앨범에서 월드페스티벌까지</text><text x="28" y="75" font-size="18" fill="#c8dde9">왼쪽은 앨범 성장 반복 · 오른쪽은 시즌의 무대</text><g><circle cx="45" cy="139" r="22" fill="#bcebdc"/><text x="45" y="147" text-anchor="middle" fill="#10334a" font-size="24" font-weight="700">1</text><rect x="84" y="108" width="466" height="89" rx="12" fill="#123e5c"/><text x="104" y="137" font-size="23" font-weight="700" fill="#f8fafb">앨범 발매</text><text x="104" y="158" font-size="17" fill="#c8dde9">기간·미션·성장·엔터파워 충족</text><text x="104" y="180" font-size="17" fill="#c8dde9">가입 크루에는 자동 공유</text></g><path d="M317 199v6" stroke="#a5c5d6" stroke-width="2" marker-end="url(#arrow)"/><g><circle cx="45" cy="239" r="22" fill="#bcebdc"/><text x="45" y="247" text-anchor="middle" fill="#10334a" font-size="24" font-weight="700">2</text><rect x="84" y="208" width="466" height="89" rx="12" fill="#123e5c"/><text x="104" y="237" font-size="23" font-weight="700" fill="#f8fafb">하루 차트 시작</text><text x="104" y="258" font-size="17" fill="#c8dde9">비슷한 성장의 상대와 경쟁</text><text x="104" y="280" font-size="17" fill="#c8dde9">보드 활동으로 팬·성적 쌓기</text></g><path d="M317 299v6" stroke="#a5c5d6" stroke-width="2" marker-end="url(#arrow)"/><g><circle cx="45" cy="339" r="22" fill="#ffd479"/><text x="45" y="347" text-anchor="middle" fill="#10334a" font-size="24" font-weight="700">3</text><rect x="84" y="308" width="466" height="89" rx="12" fill="#123e5c"/><text x="104" y="337" font-size="23" font-weight="700" fill="#f8fafb">순위·보상 상승</text><text x="104" y="358" font-size="17" fill="#c8dde9">순위가 오르면 추가 효과 상승</text><text x="104" y="380" font-size="17" fill="#c8dde9">한 바퀴 START에서 정산</text></g><path d="M317 399v6" stroke="#a5c5d6" stroke-width="2" marker-end="url(#arrow)"/><g><circle cx="45" cy="439" r="22" fill="#bcebdc"/><text x="45" y="447" text-anchor="middle" fill="#10334a" font-size="24" font-weight="700">4</text><rect x="84" y="408" width="466" height="89" rx="12" fill="#123e5c"/><text x="104" y="437" font-size="23" font-weight="700" fill="#f8fafb">하루 종료</text><text x="104" y="458" font-size="17" fill="#c8dde9">리그와 신규 버프는 종료</text><text x="104" y="480" font-size="17" fill="#c8dde9">얻은 성장·최종 성적은 보존</text></g><path d="M317 499v6" stroke="#a5c5d6" stroke-width="2" marker-end="url(#arrow)"/><g><circle cx="45" cy="539" r="22" fill="#bcebdc"/><text x="45" y="547" text-anchor="middle" fill="#10334a" font-size="24" font-weight="700">5</text><rect x="84" y="508" width="466" height="89" rx="12" fill="#123e5c"/><text x="104" y="537" font-size="23" font-weight="700" fill="#f8fafb">다음 앨범 발매</text><text x="104" y="558" font-size="17" fill="#c8dde9">늘어난 팬 + 이전 최종 성적</text><text x="104" y="580" font-size="17" fill="#c8dde9">새 리그의 시작 위치에 반영</text></g><path d="M553 546H578V145H553" fill="none" stroke="#73cdb3" stroke-width="2" marker-end="url(#arrow)"/><text x="590" y="335" font-size="17" fill="#a5e3d1">최대 8곡</text><text x="590" y="361" font-size="17" fill="#a5e3d1">반복</text><g fill="#f7fafc"><rect x="675" y="108" width="315" height="78" rx="12" fill="#214661"/><text x="694" y="139" font-size="23" font-weight="700">발매한 곡으로 무대 참여</text><text x="694" y="166" font-size="17" fill="#c8dde9">차트와 페스티벌은 별도 콘텐츠</text><path d="M832 188v23" stroke="#a5c5d6" stroke-width="2" marker-end="url(#arrow)"/><rect x="675" y="216" width="315" height="86" rx="12" fill="#214661"/><text x="694" y="250" font-size="23" font-weight="700">매주 페스티벌</text><text x="694" y="278" font-size="17" fill="#c8dde9">조회·추천·투표·배정 심사</text><path d="M832 304v39" stroke="#a5c5d6" stroke-width="2" marker-end="url(#arrow)"/><rect x="675" y="348" width="315" height="88" rx="12" fill="#614f32"/><text x="694" y="382" font-size="23" font-weight="700">마지막 9주차 월드</text><text x="694" y="409" font-size="17" fill="#fff0d1">발매곡 중 한 곡으로 최종 경쟁</text><path d="M832 438v30" stroke="#a5c5d6" stroke-width="2" marker-end="url(#arrow)"/><rect x="675" y="474" width="315" height="78" rx="12" fill="#214661"/><text x="694" y="506" font-size="23" font-weight="700">시즌 정리 → 다음 시즌</text><text x="694" y="534" font-size="17" fill="#c8dde9">기존 보존·초기화 규칙 연결</text></g><path d="M551 147H670" stroke="#a5c5d6" stroke-width="2" marker-end="url(#arrow)"/><text x="28" y="642" font-size="19" fill="#ffd479">차트에는 유저 투표가 없어요. 팬·활동·이전 성적으로 순위를 올려요.</text><text x="28" y="675" font-size="17" fill="#c8dde9">시티 투어·공연은 선택 활동 · 앨범 이벤트는 로컬 구현 · 새 주간/월드 평가와 시즌 전환은 연결 진행 중</text></g></svg>