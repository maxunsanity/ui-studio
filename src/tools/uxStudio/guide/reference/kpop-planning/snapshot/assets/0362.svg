<title id="title">앨범별 성장과 시작·종료 순위</title><desc id="desc">팬 중심 로컬 가상리그의 시작·종료 순위와 팬 계층 관측 가정입니다. 네 번째 도전과 이후 시작 일위 가능성은 보장 순위가 아닙니다.</desc>
<rect width="100%" height="100%" fill="#f7fbfd"/><g font-family="system-ui,-apple-system,Apple SD Gothic Neo,sans-serif" fill="#15334b" font-size="15">
<text x="42" y="43" font-size="28" font-weight="600">앨범 성장과 다음 출발점</text>
<text x="42" y="70" fill="#5c7180">팬 중심 로컬 시험 · 가상 리그 64가지 비교 · 보통 활동: 주사위800개 기준</text>
<text x="42" y="101" font-size="17" font-weight="500">보통 4번째 앨범에서 1위 도전  →  5~8번째는 팬·이전 성적에 따라 시작부터 1위 가능</text>
<text x="42" y="130" font-size="18" font-weight="500">시작 순위와 기간 종료 순위</text>
