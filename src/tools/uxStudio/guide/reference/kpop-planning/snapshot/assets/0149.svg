<svg xmlns="http://www.w3.org/2000/svg" width="840" height="880" viewBox="0 0 840 880" role="img" aria-labelledby="title desc"><title id="title">앨범 만들기 비용과 다시 만들기</title><desc id="desc">필요 제작비와 보유 돈을 확인하고 샘플 준비 후 다시 만들기로 이어지는 설명용 UI 시안</desc><rect width="840" height="880" fill="#eaf2f6"/><style>text{font-family:Arial,'Apple SD Gothic Neo',sans-serif;fill:#eaf5ff}.small{font-size:16px;fill:#a8c2d7}.title{font-size:29px;font-weight:700}.label{font-size:19px;font-weight:600}.gold{fill:#ffd47a}.button{fill:#10334c;font-size:20px;font-weight:700}</style><text x="28" y="38" class="label" style="fill:#17384c">음악 만들기 · 설명용 UI 시안 / 실제 화면 확인 전</text><rect x="24" y="62" width="386" height="790" rx="26" fill="#09283f"/><rect x="430" y="62" width="386" height="790" rx="26" fill="#09283f"/><text x="48" y="108" class="small">① 제작비 확인</text><text x="48" y="155" class="title">우리의 첫 싱글</text><text x="48" y="193" class="small">보컬 A · 랩 B / 혼성 듀오</text><rect x="48" y="223" width="338" height="150" rx="16" fill="#174462"/><text x="68" y="262" class="label">간편 생성</text><text x="68" y="302" class="gold label">청량한 데뷔</text><text x="68" y="341" class="small">댄스 팝 · 한국어 · 30초</text><rect x="48" y="400" width="338" height="175" rx="16" fill="#10374f" stroke="#4b7289"/><text x="68" y="438" class="label">제작비</text><text x="358" y="438" class="label gold" text-anchor="end">5,000</text><text x="68" y="483" class="small">보유한 돈</text><text x="358" y="483" class="label" text-anchor="end">12,000</text><text x="68" y="533" class="small">부족한 돈</text><text x="358" y="533" class="label" text-anchor="end">0</text><rect x="48" y="609" width="338" height="66" rx="14" fill="#ffd47a"/><text x="217" y="651" text-anchor="middle" class="button">5,000으로 만들기</text><text x="48" y="716" class="small">같은 작업은 한 번만 결제해요.</text><text x="48" y="746" class="small">연결 실패 시 제작비를 돌려줘요.</text><text x="48" y="803" class="small">게임 돈 · 로컬 임시 발란스</text><text x="454" y="108" class="small">② 샘플 준비 완료</text><text x="454" y="155" class="title">우리의 첫 싱글</text><text x="454" y="193" class="small">곡명 · 재킷 · 소개를 다듬어요.</text><rect x="454" y="223" width="338" height="150" rx="16" fill="#174462"/><text x="476" y="264" class="label">▶ 샘플 듣기</text><text x="476" y="307" class="small">원곡명 · Kevin MacLeod</text><text x="476" y="341" class="small">CC BY 4.0 · 원곡/라이선스</text><text x="454" y="417" class="label">다른 샘플이 좋다면?</text><text x="454" y="455" class="small">같은 앨범과 제목을 유지해요.</text><rect x="454" y="485" width="338" height="66" rx="14" fill="#133b54" stroke="#82a0b6"/><text x="623" y="527" text-anchor="middle" class="label">다시 만들기 · 2,500</text><text x="454" y="588" class="small">새 샘플 성공 전 기존 샘플 보존</text><rect x="454" y="609" width="338" height="66" rx="14" fill="#ffd47a"/><text x="623" y="651" text-anchor="middle" class="button">조건 확인 · 앨범 제작 완료</text><text x="454" y="716" class="small">기간 · 성장 · 미션 · 엔터파워</text><text x="454" y="746" class="small">발매는 다음 단계에서 진행해요.</text><text x="454" y="803" class="small">샘플은 선택한 목소리를 재현하지 않아요.</text></svg>