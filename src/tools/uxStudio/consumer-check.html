<!doctype html><html lang="ko"><meta charset="utf-8"><title>공통 UI 렌더러 검증</title><body><p id="result">검증 중</p><div id="root"></div><script type="module">
import {mountDesignConsumer} from './consumer.mjs';
import {createLobbyDesign} from './lobby.mjs';
try{const {catalog}=await (await fetch('/api/ux-studio/catalog')).json();const d=createLobbyDesign(catalog,'consumer-check');d.revision=1;const slot=document.createElement('div');slot.textContent='외부 콘텐츠 자리';const input=document.createElement('input');input.value='보존할 입력';slot.append(input);const consumer=mountDesignConsumer(document.querySelector('#root'),d,{slots:new Map([['world',slot]])});const parent=slot.parentNode;const next=structuredClone(d);next.revision=2;next.screens[0].elements.find(e=>e.id==='slot-world').x=5;consumer.updateDesign(next);if(slot.parentNode!==parent||input.value!=='보존할 입력'||parent.style.left!=='5%')throw Error('콘텐츠 영역 보존 실패');if(consumer.getDesign().revision!==2)throw Error('버전 갱신 실패');let rejected=false;try{consumer.updateDesign(d);}catch{rejected=true;}if(!rejected)throw Error('오래된 버전 허용');consumer.updateState({'currency.money':'100'});consumer.dispose();if(document.querySelector('#root').children.length)throw Error('dispose 실패');document.querySelector('#result').textContent='PASS · 콘텐츠 노드/입력 유지 · 배치 갱신 · 버전 거부 · 해제';}catch(e){document.querySelector('#result').textContent='FAIL · '+e.message;}
</script></body></html>
