const workspace='workspace-8e0f09e7-4699-4ac6-81b3-d545c7046ef6', project='ux-gjs-0d80d7fe';
const kinds={showroom:{base:'Page_Showroom_Shields',target:'Modal_Showroom_TokenDetail'},class:{base:'Page_Board',target:'Page_Tournament_ClassBenefits'},bean:{base:'Page_Board',target:'Modal_Event_BeanstalkDetails'}};
const host=document.querySelector('#host'),shell=document.querySelector('#shell'),sel=document.querySelector('#frame'),out=document.querySelector('#qa-status');let consumer;
